<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>FrameTrail 偵測測試</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 40px; background: #f5f5f4; color: #1c1917; font-family: Arial, sans-serif; }
      #closed-host { position: relative; display: block; width: 320px; height: 160px; margin-bottom: 28px; background: #e0e7ff; }
      .delegated { width: 280px; margin-bottom: 28px; background: #fff7ed; padding: 16px; }
      #covered-button { display: block; width: 220px; height: 48px; }
      #small-overlay-wrap { position: relative; width: 220px; height: 48px; margin-top: 28px; }
      #small-covered-button { display: block; width: 220px; height: 48px; }
      #small-blank-overlay { position: absolute; inset: 0; display: none; background: transparent; }
      body.small-overlay-armed #small-blank-overlay { display: block; }
      /* A transparent shim that swallows the hit test while showing nothing of
         its own: the shape a drag layer or modal backdrop takes. Armed from the
         test so the rest of the page stays clickable. */
      #blank-overlay { position: fixed; inset: 0; display: none; background: transparent; }
      body.overlay-armed #blank-overlay { display: block; }
    </style>
  </head>
  <body>
    <div id="closed-host"></div>
    <div id="jsaction-card" class="delegated" jsaction="keydown:card.key;click:card.open">jsaction 卡片</div>
    <div id="stimulus-card" class="delegated" data-action="card#open">Stimulus 卡片</div>
    <button id="covered-button" type="button">被遮住的按鈕</button>
    <div id="small-overlay-wrap">
      <button id="small-covered-button" type="button">被小型遮罩蓋住的按鈕</button>
      <div id="small-blank-overlay"></div>
    </div>
    <div id="blank-overlay"></div>
    <script>
      const host = document.getElementById('closed-host');
      // Closed mode: host.shadowRoot stays null, so only an extension-privileged
      // accessor can reach the button inside.
      const shadowRoot = host.attachShadow({ mode: 'closed' });
      shadowRoot.innerHTML =
        '<style>button { position: absolute; left: 70px; top: 58px; width: 180px; height: 44px; }</style>' +
        '<button id="shadow-button" type="button">影子按鈕</button>';

      window.detectionProbe = {
        rectOf(id) {
          const element = id === 'shadow-button' ? shadowRoot.getElementById(id) : document.getElementById(id);
          const rect = element.getBoundingClientRect();
          return { x: rect.x, y: rect.y, width: rect.width, height: rect.height };
        },
        armOverlay() {
          document.body.classList.add('overlay-armed');
        },
        armSmallOverlay() {
          document.body.classList.add('small-overlay-armed');
        },
      };
    </script>
  </body>
</html>
